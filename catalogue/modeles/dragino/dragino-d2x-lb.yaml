# Dragino D22-LB / D23-LB (et -LS) : deux ou trois sondes de température. Noms repris de la V2 (table d2x).
cle: dragino-d2x-lb
prefixe_id: d23               # id du capteur dans TTN : d23-<4 derniers caractères du DevEUI>
marque: Dragino
modele: D22/D23-LB
libelle: Thermomètre 2 ou 3 sondes Dragino D22-LB, D23-LB
bouton: D22-LB, D23-LB
type: capteur
categorie: temperature
ordre: 4
detection: {textes: [D22-LB, D23-LB, D22, D23]}
allumage: "Allumez-le : appui long 5 s sur le bouton, la LED verte clignote."   # à vérifier
dr: {brand_id: dragino, model_id: d23-lb, firmware_version: "1.0", band_id: EU_863_870}
dr_alias: [d22-lb, d23-lb, d22-ls, d23-ls]
lorawan: {mac: MAC_V1_0_3, phy: PHY_V1_0_3_REV_A, classe: A}
decodeurs:
  - fichier: decodeurs/dragino/D23-LB_v1.3_TTN_decode.js
    source: https://github.com/dragino/dragino-end-node-decoder/blob/9d45ece5c28b4914904970fbe94bb09299b995c7/D20-LB%26D20S-LB%26D22-LB%26D23-LB/D23-LB_v1.3_TTN_decode.txt
ports: {2: mesures, 5: statut}
port5: {code: 0x19, cle_firmware: FIRMWARE_VERSION, cle_bande: FREQUENCY_BAND}
intervalle_defaut_s: 1200
batterie: {cle: BatV, cle_statut: BAT, facteur_mv: 1000, pile: lithium}   # ER26500 8500 mAh
mode: {octet: 6, masque: 0x7C, decalage: 2}
mesures:
  TempC1: {nom: temp_white, libelle: Sonde blanche, couleur: text, unite: "°C", decimales: 1, principale: true, alerte: seuil,
           hysteresis: 0.5, seuils_proposes: {min: [0, 2, 5], max: [30, 35, 40]}}
  TempC2: {nom: temp_red, libelle: Sonde rouge, couleur: red, unite: "°C", decimales: 1, principale: true, alerte: seuil,
           hysteresis: 0.5, seuils_proposes: {min: [0, 2, 5], max: [30, 35, 40]}}
  TempC3: {nom: temp_black, libelle: Sonde noire, couleur: "#7c7c7c", unite: "°C", decimales: 1, alerte: seuil,
           hysteresis: 0.5, seuils_proposes: {min: [0, 2, 5], max: [30, 35, 40]}}
modes:
  "3": {libelle: Sondes de température, mesures: [temp_white, temp_red, temp_black]}
# Mode 31 : relevé des seuils d'alarme réglés dans le capteur, pas une mesure.
grafana:
  panneaux:
    - {type: courbe, mesures: [temp_white, temp_red, temp_black]}
    - {type: batterie}
    - {type: radio}
