# Dragino DDS45-LB / LDDS45 : distance par ultrasons (niveau de cuve), sonde de température facultative.
# LDDS45 (ancienne génération) : même trame ; son décodeur V1.1 écrit les unités dans les valeurs, on garde celui du DDS45-LB.
cle: dragino-dds45-lb
prefixe_id: dds45               # id du capteur dans TTN : dds45-<4 derniers caractères du DevEUI>
marque: Dragino
modele: DDS45-LB
libelle: Capteur de distance Dragino DDS45
bouton: DDS45
type: capteur
categorie: niveau
ordre: 10
detection: {textes: [DDS45-LB, LDDS45, DDS45]}
allumage: "Allumez-le : appui long 5 s sur le bouton, la LED verte clignote."   # à vérifier
dr: {brand_id: dragino, model_id: dds45-lb, firmware_version: "1.0", band_id: EU_863_870}
dr_alias: [dds45-lb, dds45-ls, ldds45]
lorawan: {mac: MAC_V1_0_3, phy: PHY_V1_0_3_REV_A, classe: A}
decodeurs:
  - fichier: decodeurs/dragino/DDS45-LB_TTN_Decoder.js
    source: https://github.com/dragino/dragino-end-node-decoder/blob/9d45ece5c28b4914904970fbe94bb09299b995c7/DDS45-LB/DDS45-LB_TTN_Decoder.txt
ports: {2: mesures, 5: statut}
port5: {code: 0x28, cle_firmware: FIRMWARE_VERSION, cle_bande: FREQUENCY_BAND}
intervalle_defaut_s: 1200
batterie: {cle: Bat, cle_statut: BAT, facteur_mv: 1000, pile: lithium}   # ER26500 8500 mAh
mesures:
  Distance: {nom: distance_cm, libelle: Distance, unite: cm, decimales: 0, facteur: 0.1, principale: true, ignorer: [0],
             alerte: seuil, hysteresis: 2}
  TempC_DS18B20: {nom: temperature_probe, libelle: Température sonde, unite: "°C", decimales: 1, alerte: seuil,
                  hysteresis: 0.5, seuils_proposes: {min: [0, 2, 5], max: [30, 35, 40]}}
grafana:
  panneaux:
    - {type: courbe, mesures: [distance_cm]}
    - {type: courbe, mesures: [temperature_probe]}
    - {type: batterie}
    - {type: radio}
