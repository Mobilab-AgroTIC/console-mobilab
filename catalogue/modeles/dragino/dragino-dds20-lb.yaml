# Dragino DDS20-LB : distance par ultrasons au contact (niveau de liquide à travers la paroi), sonde de température facultative.
cle: dragino-dds20-lb
prefixe_id: dds20               # id du capteur dans TTN : dds20-<4 derniers caractères du DevEUI>
marque: Dragino
modele: DDS20-LB
libelle: Capteur de distance Dragino DDS20-LB
bouton: DDS20-LB
type: capteur
categorie: niveau
detection: {textes: [DDS20-LB, DDS20, LDDS20]}
allumage: "Allumez-le : appui long 5 s sur le bouton, la LED verte clignote."   # à vérifier
dr: {brand_id: dragino, model_id: dds20-lb, firmware_version: "1.0.0", band_id: EU_863_870}
dr_alias: [dds20-lb, dds20-ls, ldds20]
lorawan: {mac: MAC_V1_0_3, phy: PHY_V1_0_3_REV_A, classe: A}
decodeurs:
  - fichier: decodeurs/dragino/DDS20-LB_TTN_Decoder.js
    source: https://github.com/dragino/dragino-end-node-decoder/blob/9d45ece5c28b4914904970fbe94bb09299b995c7/DDS20-LB/DDS20-LB_TTN_Decoder.txt
ports: {2: mesures, 5: statut}
port5: {code: 0x29, cle_firmware: FIRMWARE_VERSION, cle_bande: FREQUENCY_BAND}
intervalle_defaut_s: 1200
batterie: {cle: Bat, cle_statut: BAT, facteur_mv: 1000, pile: lithium}   # ER26500 8500 mAh
mesures:
  Distance: {nom: distance_cm, libelle: Distance, unite: cm, decimales: 0, facteur: 0.1, principale: true, ignorer: [0],
             alerte: seuil, hysteresis: 2}
  TempC_DS18B20: {nom: temperature_probe, libelle: Température sonde, unite: "°C", decimales: 1, ignorer: [3276.7], alerte: seuil,
                 hysteresis: 0.5, seuils_proposes: {min: [0, 2, 5], max: [30, 35, 40]}}   # dixièmes de °C
grafana:
  panneaux:
    - {type: courbe, mesures: [distance_cm]}
    - {type: courbe, mesures: [temperature_probe]}
    - {type: batterie}
    - {type: radio}
